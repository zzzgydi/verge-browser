name: Release DSH Plugin

on:
  workflow_dispatch:
  push:
    tags:
      - "dsh-plugin-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/dsh-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.5.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
          cache-dependency-path: packages/dsh-plugin/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check tag matches the package version
        run: test "dsh-plugin-v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Type check
        run: pnpm check

      - name: Test package
        run: pnpm test

      - name: Verify packed artifacts
        run: pnpm pack:check

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
